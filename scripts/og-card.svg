<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fe8c01"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7c33"/>
      <stop offset="0.55" stop-color="#e05504"/>
      <stop offset="1" stop-color="#b53d04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="320" fill="#fe8c01" opacity="0.08"/>
  <circle cx="120" cy="560" r="260" fill="#fe8c01" opacity="0.06"/>

  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3" fill="#fe8c01">UNIVERSAL APPS · UNI·SIM</text>
  <text x="78" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="#f8fafc">Universal Webinar</text>
  <text x="80" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#cbd5e1">Host live webinars right in</text>
  <text x="80" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#cbd5e1">the browser — no installs.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
    <rect x="80" y="438" width="150" height="52" rx="26" fill="url(#accent)"/>
