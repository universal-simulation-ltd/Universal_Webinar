      <path d="M14 22.5C14 19.46 16.46 17 19.5 17h17C39.54 17 42 19.46 42 22.5v19C42 44.54 39.54 47 36.5 47h-17C16.46 47 14 44.54 14 41.5v-19Z" fill="white" fill-opacity="0.95"/>
      <path d="M52 24.5a1.5 1.5 0 0 0-2.32-1.25L44 26.9v10.2l5.68 3.65A1.5 1.5 0 0 0 52 39.5V24.5Z" fill="white" fill-opacity="0.95"/>
