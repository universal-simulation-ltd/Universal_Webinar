    <rect x="246" y="438" width="186" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="339" y="472" text-anchor="middle" fill="#e2e8f0">Screen share</text>
    <rect x="448" y="438" width="158" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="527" y="472" text-anchor="middle" fill="#e2e8f0">In-browser</text>
  </g>

  <text x="80" y="556" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#94a3b8">opensource.unisim.co.uk/webinar</text>

  <!-- Right: product mark (Webinar camera favicon, scaled 64 -> 344) -->
  <g transform="translate(792, 143)">
    <g transform="scale(5.375)">
